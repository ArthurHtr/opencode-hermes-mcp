name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Show artifacts
        run: ls -l dist

  # Smoke test against a LIVE OpenCode 1.18.18 server. The smoke makes NO LLM
  # calls (tool surface + agent validation + session listing), so the server
  # runs with a fake/placeholder provider.
  smoke:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCode 1.18.18 (pinned)
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.18

      - name: Generate server credentials
        run: |
          python3 - <<'PY'
          import json, os, secrets
          data = {
              "base_url": "http://127.0.0.1:4096",
              "username": "opencode",
              "password": secrets.token_urlsafe(16),
              "port": 4096,
          }
          os.makedirs(os.path.expanduser("~/.config/hermes"), exist_ok=True)
          path = os.path.expanduser("~/.config/hermes/opencode-server.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print("credentials written to", path)
          PY

      - name: Start OpenCode server (background, fake provider)
        run: |
          # Fake provider: the smoke test makes no LLM calls, so the endpoint
          # is never contacted.
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "fake/fake-model",
            "provider": {
              "fake": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Fake (CI placeholder)",
                "options": {
                  "baseURL": "http://127.0.0.1:9/v1",
                  "apiKey": "ci-placeholder"
                },
                "models": {
                  "fake-model": { "name": "fake-model" }
                }
              }
            }
          }
          EOF
          CFG="$HOME/.config/hermes/opencode-server.json"
          export OPENCODE_SERVER_USERNAME="$(python3 -c "import json;print(json.load(open('$CFG'))['username'])")"
          export OPENCODE_SERVER_PASSWORD="$(python3 -c "import json;print(json.load(open('$CFG'))['password'])")"
          cd "$HOME"
          nohup "$HOME/.opencode/bin/opencode" serve --hostname 127.0.0.1 --port 4096 \
            > /tmp/opencode-serve.log 2>&1 &
          echo $! > /tmp/opencode-serve.pid
          echo "opencode serve started (pid $(cat /tmp/opencode-serve.pid))"

      - name: Wait for server health
        run: |
          CFG="$HOME/.config/hermes/opencode-server.json"
          AUTH="$(python3 -c "import json;c=json.load(open('$CFG'));print(c['username']+':'+c['password'])")"
          for _ in $(seq 1 30); do
            if curl -sf -u "$AUTH" http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              echo "server healthy"
              exit 0
            fi
            sleep 1
          done
          echo "--- opencode serve log ---"
          cat /tmp/opencode-serve.log
          exit 1

      - name: Prepare test directory
        run: mkdir -p /tmp/oc-mcp-test/gitrepo

      - name: Install package into a venv
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install .

      - name: Run smoke test (no LLM)
        run: |
          CFG="$HOME/.config/hermes/opencode-server.json"
          export OPENCODE_SERVER_URL="$(python3 -c "import json;print(json.load(open('$CFG'))['base_url'])")"
          export OPENCODE_SERVER_USERNAME="$(python3 -c "import json;print(json.load(open('$CFG'))['username'])")"
          export OPENCODE_SERVER_PASSWORD="$(python3 -c "import json;print(json.load(open('$CFG'))['password'])")"
          /tmp/smoke-venv/bin/python -m opencode_hermes_mcp.smoke_client
