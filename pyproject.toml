[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-hermes-mcp"
version = "0.4.1"
description = "Deterministic MCP controller between Hermes (supervisor LLM) and the permanent OpenCode server. OpenCode pin defined in opencode_hermes_mcp/pin.txt (currently 1.18.21)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Arthur Hottier", email = "arthur.ho2tier@gmail.com"},
]
keywords = ["mcp", "model-context-protocol", "opencode", "hermes", "controller", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp==1.12.4",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
opencode-mcp-controller = "opencode_hermes_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ArthurHtr/opencode-hermes-mcp"
Repository = "https://github.com/ArthurHtr/opencode-hermes-mcp"
"Issue Tracker" = "https://github.com/ArthurHtr/opencode-hermes-mcp/issues"

[tool.setuptools]
packages = ["opencode_hermes_mcp"]

[tool.setuptools.package-data]
opencode_hermes_mcp = ["pin.txt"]
